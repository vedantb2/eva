packages:
  - "packages/*"
  - "apps/*"

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - prettier
  # Native (Rust) React Compiler landed 2026-08-18 and is what the web build
  # runs; the 7-day soak would block installs until it ages in.
  - "@vitejs/plugin-react"
  - oxc-transform-react
  - "@oxc-transform-react/*"
  # Same release: oxlint 1.79 is the first with the React Compiler lint rules.
  - oxlint
  - "@oxlint/*"
