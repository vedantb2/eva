<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Favicon: inset rounded-full disc + star (badge overlays at runtime).
       Disc is not full-bleed so the badge can sit on top without viewBox crop.
       Mirrors evaMark.ts. -->
  <defs>
    <clipPath id="eva-disc">
      <circle cx="210" cy="210" r="210" />
    </clipPath>
  </defs>
  <circle cx="210" cy="210" r="210" fill="#FFFFFF" />
  <g
    clip-path="url(#eva-disc)"
    transform="translate(210 210) scale(1.189453125) translate(-256 -256)"
  >
    <polygon points="0,256 217,237 256,64 295,237 512,256" fill="#8B3FB8" />
    <polygon points="0,256 217,275 256,449 295,275 512,256" fill="#3B7DD8" />
  </g>
</svg>
