<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Favicon: the mark scaled to 240/256 so the unread badge has room to
       half-overlap the disc's bottom-right edge without shrinking the logo
       Discord-style. FaviconController replaces this href with a theme-exact
       data URI once React mounts; the media query below only has to cover the
       moment before that (and cannot express the neutral theme, which falls
       back to dark). Mirrors evaMark.ts. -->
  <style>
    .eva-disc { fill: #FFFFFF }
    @media (prefers-color-scheme: dark) { .eva-disc { fill: #17181A } }
  </style>
  <g transform="scale(0.9375)">
    <circle class="eva-disc" cx="256" cy="256" r="256" />
    <polygon points="0,256 217,237 256,64 295,237 512,256" fill="#8B3FB8" />
    <polygon points="0,256 217,275 256,449 295,275 512,256" fill="#3B7DD8" />
  </g>
</svg>
